<!DOCTYPE html>
	<html>

		<head>
				<title> Sign up Page </title>

				<!--External link to css-->
				<link rel="stylesheet" href="style.css"> 

		</head>

		<body>
				
				<!--SignUp Page-->
					
				<div class="logo-container">
					<img src="TunePlay (2).png" alt="TunePlay Logo" class="logo">
					<h2 class="brand-title">TunePlay</h2>
				</div>

				<div class= "container" id="signUp">

				

					<h1 class= "title">Sign Up</h1>
					<form method="post" action="signup-Valid.php" novalidate >

						<!-- Username Form-->
							<div class= "forminput">
								<div id = "usernameinput">				
									<label for="Username"> Create Username</label>
									<input type="text" name="username" id= "Username" placeholder=" Enter Username" required>
								</div>

								<!-- Password Form-->
								<div id= "passwordinput">
									<label for="Password"> Create Password</label>
									<input type="password" name="password" id= "Password" placeholder="Enter Password" maxlength="15" minlength="8" required>
								</div>

									<!-- Password Repeat-->
								<div id= "passwordVerifyinput">
										<label for="Password"> Repeat Password</label>
										<input type="password" name=" passwordVerify" id= "Password" placeholder="Password" required>  


								</div>
							</div>

							<!-- Sign Up Button-->
							<div class= "submitbutton">
								<button type= "Submit"> Sign Up </button>
								<div class="links">
									<p> Already Have An Account?</p>
									 <a href="index.html">Login</a>
								</div>	
				
							</div>

					</form>
						
				</div>

				<script src="script.js"></script>

			



		</body>






</html>
